trigger: none

pr: none

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: jugaldevops-ux/Infra
      endpoint: GitHub-Service-Connection
      ref: refs/heads/main

pool:
  name: Pipeline-Agent

stages:

# ==========================================================
# Stage 1 - Terraform Validation & Plan
# ==========================================================

- stage: Terraform_Plan
  displayName: Terraform Plan

  jobs:

    - job: Plan
      displayName: Terraform Validate and Plan

      steps:

        # Checkout GitHub Terraform repository
        - checkout: InfraRepo
          clean: true

        # Verify Terraform installation
        - powershell: |
            terraform version
          displayName: Verify Terraform

        # Terraform Init
        - powershell: |
            terraform init
          workingDirectory: $(Build.SourcesDirectory)/Infra
          displayName: Terraform Init

        # Terraform Format Check
        - powershell: |
            terraform fmt -check -recursive
          workingDirectory: $(Build.SourcesDirectory)/Infra
          displayName: Terraform Format Check

        # Terraform Validate
        - powershell: |
            terraform validate
          workingDirectory: $(Build.SourcesDirectory)/Infra
          displayName: Terraform Validate

        # Terraform Plan
        - powershell: |
            terraform plan -out=tfplan
          workingDirectory: $(Build.SourcesDirectory)/Infra
          displayName: Terraform Plan

        # Publish Terraform Plan
        - publish: $(Build.SourcesDirectory)/Infra/tfplan
          artifact: terraform-plan
          displayName: Publish Terraform Plan


# ==========================================================
# Stage 2 - Terraform Apply
# ==========================================================

- stage: Terraform_Apply
  displayName: Terraform Apply

  dependsOn: Terraform_Plan

  condition: succeeded()

  jobs:

    - deployment: Apply
      displayName: Terraform Apply

      environment: Terraform-Production

      strategy:
        runOnce:
          deploy:

            steps:

              # Checkout same GitHub repository
              - checkout: InfraRepo
                clean: true

              # Download Terraform Plan
              - download: current
                artifact: terraform-plan

              # Verify Terraform
              - powershell: |
                  terraform version
                displayName: Verify Terraform

              # Terraform Init
              - powershell: |
                  terraform init
                workingDirectory: $(Build.SourcesDirectory)/Infra
                displayName: Terraform Init

              # Copy plan file
              - powershell: |
                  Copy-Item `
                    "$(Pipeline.Workspace)\terraform-plan\tfplan" `
                    "$(Build.SourcesDirectory)\Infra\tfplan" `
                    -Force
                displayName: Download Terraform Plan

              # Terraform Apply
              - powershell: |
                  terraform apply -auto-approve tfplan
                workingDirectory: $(Build.SourcesDirectory)/Infra
                displayName: Terraform Apply